<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画展示 - 吸血鬼节奏游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #330033 50%, #1a0033 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(255, 51, 102, 0.2);
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #ff3366;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: #ff3366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            background: #ff5588;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }

        button.active {
            background: #00ff88;
            color: #000;
        }

        select, input[type="range"] {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ff3366;
            background: rgba(0, 0, 0, 0.7);
            color: white;
        }

        .animation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .animation-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff3366;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }

        .animation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 51, 102, 0.3);
            border-color: #ff5588;
        }

        .animation-card h3 {
            color: #ff3366;
            margin-bottom: 10px;
            font-size: 1.2em;
            text-align: center;
        }

        .animation-canvas-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            margin-bottom: 10px;
        }

        .animation-canvas {
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        .animation-info {
            font-size: 0.9em;
            color: #aaa;
            margin-top: 10px;
        }

        .animation-info div {
            margin: 5px 0;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
            color: #ff3366;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            color: #ff6666;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(255, 51, 102, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff3366;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag:hover, .tag.active {
            background: #ff3366;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦇 动画展示系统</h1>
        <p>吸血鬼节奏游戏 - 序列帧动画验证</p>
        <div class="stats">
            <div class="stat-item">
                <strong>BOSS动画:</strong> <span id="bossCount">0</span>
            </div>
            <div class="stat-item">
                <strong>小怪动画:</strong> <span id="enemyCount">0</span>
            </div>
            <div class="stat-item">
                <strong>总计:</strong> <span id="totalCount">0</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>播放速度:</label>
            <input type="range" id="fpsSlider" min="1" max="30" value="10" step="1">
            <span id="fpsValue">10 FPS</span>
        </div>
        <div class="control-group">
            <button id="playAllBtn">▶ 全部播放</button>
            <button id="pauseAllBtn">⏸ 全部暂停</button>
        </div>
        <div class="control-group">
            <label>筛选:</label>
            <select id="filterSelect">
                <option value="all">全部</option>
                <option value="boss">仅BOSS</option>
                <option value="enemy">仅小怪</option>
            </select>
        </div>
    </div>

    <div class="filter-tags" id="filterTags"></div>

    <div id="loading" class="loading">正在加载动画...</div>
    <div id="animationGrid" class="animation-grid"></div>

    <script>
        // 动画配置
        const BOSS_ANIMATIONS = [
            'fallen-priest-idle', 'fallen-priest-attack', 'fallen-priest-hurt', 'fallen-priest-death',
            'bat-king-idle', 'bat-king-attack', 'bat-king-hurt', 'bat-king-death',
            'crypt-guardian-idle', 'crypt-guardian-attack', 'crypt-guardian-hurt', 'crypt-guardian-death',
            'graveyard-lord-idle', 'graveyard-lord-attack', 'graveyard-lord-hurt', 'graveyard-lord-death',
            'zombie-king-idle', 'zombie-king-attack', 'zombie-king-hurt', 'zombie-king-death',
            'werewolf-alpha-idle', 'werewolf-alpha-attack', 'werewolf-alpha-hurt', 'werewolf-alpha-death',
            'castle-commander-idle', 'castle-commander-attack', 'castle-commander-hurt', 'castle-commander-death',
            'ancient-librarian-idle', 'ancient-librarian-attack', 'ancient-librarian-hurt', 'ancient-librarian-death',
            'succubus-idle', 'succubus-attack', 'succubus-hurt', 'succubus-death',
            'vampire-king-idle', 'vampire-king-attack', 'vampire-king-hurt', 'vampire-king-death',
        ];

        // 动画播放器类
        class AnimationPlayer {
            constructor(animationName, canvasId) {
                this.animationName = animationName;
                this.canvasId = canvasId;
                this.frames = [];
                this.currentFrame = 0;
                this.isPlaying = true;
                this.fps = 10;
                this.lastFrameTime = 0;
                this.config = null;
            }

            async load() {
                try {
                    // 加载配置
                    const configPath = `/animations/boss-${this.animationName}/animation.json`;
                    const configResponse = await fetch(configPath);
                    this.config = await configResponse.json();

                    // 加载所有帧
                    const frameCount = this.config.frameCount;
                    for (let i = 0; i < frameCount; i++) {
                        const img = new Image();
                        const framePath = `/animations/boss-${this.animationName}/frame_${String(i).padStart(2, '0')}.png`;
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = reject;
                            img.src = framePath;
                        });
                        this.frames.push(img);
                    }

                    return true;
                } catch (error) {
                    console.error(`Failed to load animation: ${this.animationName}`, error);
                    return false;
                }
            }

            draw() {
                const canvas = document.getElementById(this.canvasId);
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                const frame = this.frames[this.currentFrame];

                if (frame) {
                    canvas.width = frame.width;
                    canvas.height = frame.height;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(frame, 0, 0);
                }
            }

            update(timestamp) {
                if (!this.isPlaying) return;

                const frameInterval = 1000 / this.fps;
                if (timestamp - this.lastFrameTime >= frameInterval) {
                    this.currentFrame = (this.currentFrame + 1) % this.frames.length;
                    this.draw();
                    this.lastFrameTime = timestamp;
                }
            }

            play() {
                this.isPlaying = true;
            }

            pause() {
                this.isPlaying = false;
            }

            setFPS(fps) {
                this.fps = fps;
            }
        }

        // 全局动画播放器列表
        const players = [];
        let animationFrameId = null;

        // 动画循环
        function animate(timestamp) {
            players.forEach(player => player.update(timestamp));
            animationFrameId = requestAnimationFrame(animate);
        }

        // 加载所有动画
        async function loadAllAnimations() {
            const grid = document.getElementById('animationGrid');
            const loading = document.getElementById('loading');
            
            let bossCount = 0;
            let enemyCount = 0;

            for (const animName of BOSS_ANIMATIONS) {
                const card = document.createElement('div');
                card.className = 'animation-card';
                card.dataset.type = 'boss';
                card.dataset.name = animName;

                const canvasId = `canvas-${animName}`;
                
                card.innerHTML = `
                    <h3>${animName.replace(/-/g, ' ').toUpperCase()}</h3>
                    <div class="animation-canvas-container">
                        <canvas id="${canvasId}" class="animation-canvas"></canvas>
                    </div>
                    <div class="animation-info">
                        <div>帧数: <span id="info-frames-${animName}">-</span></div>
                        <div>尺寸: <span id="info-size-${animName}">-</span></div>
                        <div>状态: <span id="info-status-${animName}">加载中...</span></div>
                    </div>
                `;

                grid.appendChild(card);

                // 创建播放器
                const player = new AnimationPlayer(animName, canvasId);
                const success = await player.load();

                if (success) {
                    players.push(player);
                    player.draw();
                    bossCount++;

                    // 更新信息
                    document.getElementById(`info-frames-${animName}`).textContent = player.frames.length;
                    document.getElementById(`info-size-${animName}`).textContent = 
                        `${player.frames[0]?.width || 0}x${player.frames[0]?.height || 0}`;
                    document.getElementById(`info-status-${animName}`).textContent = '✓ 就绪';
                    document.getElementById(`info-status-${animName}`).style.color = '#00ff88';
                } else {
                    document.getElementById(`info-status-${animName}`).textContent = '✗ 加载失败';
                    document.getElementById(`info-status-${animName}`).style.color = '#ff6666';
                }
            }

            // 更新统计
            document.getElementById('bossCount').textContent = bossCount;
            document.getElementById('enemyCount').textContent = enemyCount;
            document.getElementById('totalCount').textContent = bossCount + enemyCount;

            loading.style.display = 'none';

            // 开始动画循环
            animationFrameId = requestAnimationFrame(animate);
        }

        // 控制按钮
        document.getElementById('playAllBtn').addEventListener('click', () => {
            players.forEach(p => p.play());
        });

        document.getElementById('pauseAllBtn').addEventListener('click', () => {
            players.forEach(p => p.pause());
        });

        document.getElementById('fpsSlider').addEventListener('input', (e) => {
            const fps = parseInt(e.target.value);
            document.getElementById('fpsValue').textContent = `${fps} FPS`;
            players.forEach(p => p.setFPS(fps));
        });

        document.getElementById('filterSelect').addEventListener('change', (e) => {
            const filter = e.target.value;
            const cards = document.querySelectorAll('.animation-card');
            
            cards.forEach(card => {
                if (filter === 'all') {
                    card.style.display = 'block';
                } else {
                    card.style.display = card.dataset.type === filter ? 'block' : 'none';
                }
            });
        });

        // 页面加载时初始化
        window.addEventListener('load', () => {
            loadAllAnimations();
        });
    </script>
</body>
</html>
